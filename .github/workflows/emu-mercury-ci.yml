name: "[EMU] Mercury CI"

on:
  workflow_dispatch:
    inputs:
      run_linux:
        description: 'Run Linux builds'
        type: boolean
        default: true
      run_linux_fuzz:
        description: 'Run Linux fuzz test'
        type: boolean
        default: true
      run_linux_coverage:
        description: 'Run Linux coverage'
        type: boolean
        default: true
      run_macos:
        description: 'Run macOS build'
        type: boolean
        default: true
      run_windows:
        description: 'Run Windows build'
        type: boolean
        default: true
      build_packages:
        description: 'Build packages'
        type: boolean
        default: true
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ========== Linux Multi-Distro Build and Test ==========

  linux-ci:
    if: github.event_name != 'workflow_dispatch' || inputs.run_linux
    name: "linux-ci (${{ matrix.testplatform }}${{ matrix.xsimd && format(',{0}', matrix.xsimd) || '' }}${{ matrix.arch && format(',{0}', matrix.arch) || '' }})"
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        testplatform: [alma8, alma9, alma10, ubuntu20, ubuntu22, ubuntu24, ubuntu26, debian11, debian12, debian13]
        xsimd: [""]  # default: autodetect system xsimd, fallback to scalar
        arch: [""]   # default: amd64
        include:
          - testplatform: ubuntu22
            xsimd: xsimd-bundled
          - testplatform: ubuntu24
            arch: arm64
    container:
      image: ghcr.io/cisco-netintel/${{matrix.testplatform}}:buildenv
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Echo OS version
        run: cat /etc/os-release
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: configure
        env:
          XSIMD_FLAGS: ${{ matrix.xsimd == 'xsimd-bundled' && '--enable-xsimd --with-xsimd-include=src/libmerc/xsimd/include' || '' }}
        run: |
          touch configure  # update mtime to avoid automatic regen
          ./configure $XSIMD_FLAGS
      - name: Build Mercury RelWithDebInfo
        run: make -j$(nproc) V=1
      - name: Build Mercury Debug (-O0)
        run: make -j$(nproc) V=1 BUILD_TYPE=Debug
      - name: Build Mercury Debug+ASan (-O2)
        run: make -j$(nproc) V=1 BUILD_TYPE=Debug SANITIZE=address OPTFLAGS=-O2
      - name: Build Mercury Debug+ASan+visdefault (multiprotocol)
        run: make -j$(nproc) V=1 BUILD_TYPE=Debug SANITIZE=address VISIBILITY=default OPTFLAGS=-O2
      - name: Build Mercury Debug+ASan+visdefault+staticcfgtls (tls-only)
        run: make -j$(nproc) V=1 BUILD_TYPE=Debug SANITIZE=address VISIBILITY=default STATIC_CFG=tls OPTFLAGS=-O2
      - name: Build libmerc.so test drivers
        run: make -j$(nproc) V=1 BUILD_TYPE=Debug SANITIZE=address OPTFLAGS=-O2 libmerc-test-drivers
      - name: Generate token for cross-repo access
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REPO_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_READER_PRIVATE_KEY }}
          owner: cisco-netintel
      - name: Checkout mercury-resources
        uses: actions/checkout@v6
        with:
          repository: cisco-netintel/mercury-resources
          ref: verified
          path: unit_tests/xtra/resources
          token: ${{ steps.app-token.outputs.token }}
      - name: Run test-cython (RelWithDebInfo)
        run: make V=1 test-cython
      - name: Run tests (Debug+ASan)
        run: |
          # Work around benign OpenSSL 3.x CRYPTO_malloc leaks at exit.
          # alma9: 120 bytes via provider_activate.
          # alma10: 240 bytes via CONF_modules_load (https://github.com/openssl/openssl/issues/29077).
          case "${{ matrix.testplatform }}" in
            alma9)  export LSAN_OPTIONS="suppressions=$GITHUB_WORKSPACE/test/lsan.supp" ;;
            alma10) export OPENSSL_CONF=/dev/null ;;
          esac
          # OPTFLAGS=-O2 overrides Debug's -O0 so ASan tests finish in
          # reasonable time.  No -j for readable test output.
          make V=1 BUILD_TYPE=Debug SANITIZE=address OPTFLAGS=-O2 test
      - name: Run batch_gcd tests (Debug+ASan)
        run: make V=1 BUILD_TYPE=Debug SANITIZE=address OPTFLAGS=-O2 test-batch-gcd

  # ========== Linux Fuzz Testing ==========

  linux-fuzz:
    if: github.event_name != 'workflow_dispatch' || inputs.run_linux_fuzz
    runs-on: ubuntu-latest-16-cores
    timeout-minutes: 60
    container:
      image: ghcr.io/cisco-netintel/ubuntufuzz:buildenv
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Echo OS version
        run: cat /etc/os-release
      - name: Display system resources
        run: |
          echo "CPU count:"
          nproc
          echo
          echo "Memory info:"
          free -h
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure Mercury
        run: |
          touch configure  # update mtime to avoid automatic regen
          ./configure
      - name: Run Fuzz Test
        run: make -j$(nproc) V=1 test-fuzz

  # ========== Linux Coverage ==========

  linux-coverage:
    if: github.event_name != 'workflow_dispatch' || inputs.run_linux_coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/cisco-netintel/ubuntu24:buildenv
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      cur_pct:  ${{ steps.report.outputs.cur_pct }}
      base_pct: ${{ steps.report.outputs.base_pct }}
      cur_uncov:  ${{ steps.report.outputs.cur_uncov }}
      base_uncov: ${{ steps.report.outputs.base_uncov }}
      base_sha: ${{ steps.report.outputs.base_sha }}
      base_ref: ${{ steps.report.outputs.base_ref }}
      gnc:      ${{ steps.report.outputs.gnc }}
      unc:      ${{ steps.report.outputs.unc }}
      lbc:      ${{ steps.report.outputs.lbc }}
      report_url: ${{ steps.upload.outputs.artifact-url }}   # empty if upload failed
    steps:
      - name: Echo OS version
        run: cat /etc/os-release
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - name: Mark workspace repo directories as safe for git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/base"

      - name: Coverage reporter self-test
        run: python3 -m doctest test/coverage/cov_diff_report.py

      # Sets base_sha/head_sha; base_sha == head_sha => na (baseline steps skip).
      - name: Resolve baseline merge-base
        id: mergebase
        run: test/coverage/cov_mergebase.sh

      # ----- Baseline (merge-base): same build as HEAD, in base/ -----
      - name: Baseline — checkout
        if: steps.mergebase.outputs.base_sha != steps.mergebase.outputs.head_sha
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.mergebase.outputs.base_sha }}
          path: base
          submodules: true
      - name: Baseline — configure Mercury
        if: steps.mergebase.outputs.base_sha != steps.mergebase.outputs.head_sha
        working-directory: base
        run: |
          touch configure  # update mtime to avoid automatic regen
          ./configure
      - name: Baseline — build Coverage variant
        if: steps.mergebase.outputs.base_sha != steps.mergebase.outputs.head_sha
        working-directory: base
        run: make -j$(nproc) V=1 BUILD_TYPE=Coverage
      - name: Baseline — run test-coverage
        if: steps.mergebase.outputs.base_sha != steps.mergebase.outputs.head_sha
        working-directory: base
        run: |
          make -j$(nproc) V=1 test-coverage
          # baselines predating the coverage_data/ rename emit coverage/
          cov=build/Coverage
          [ -d "$cov/coverage_data" ] || mv "$cov/coverage" "$cov/coverage_data"
      - name: Baseline — extract libmerc coverage
        if: steps.mergebase.outputs.base_sha != steps.mergebase.outputs.head_sha
        run: >-
          test/coverage/cov_extract.sh
          --rewrite "$GITHUB_WORKSPACE/base/" "$GITHUB_WORKSPACE/"
          base/build/Coverage/coverage_data/filtered.info
          build/Coverage/base.libmerc.info

      # ----- HEAD: the same build -----
      - name: HEAD — configure Mercury
        run: |
          touch configure  # update mtime to avoid automatic regen
          ./configure
      - name: HEAD — build Coverage variant
        run: make -j$(nproc) V=1 BUILD_TYPE=Coverage
      - name: HEAD — run test-coverage
        run: make -j$(nproc) V=1 test-coverage
      - name: HEAD — extract libmerc coverage
        run: >-
          test/coverage/cov_extract.sh
          build/Coverage/coverage_data/filtered.info
          build/Coverage/cur.libmerc.info

      # ----- Summarize + publish (no gate); feeds coverage-gate -----
      - name: Summarize libmerc coverage (+ differential if baseline)
        id: report
        run: test/coverage/cov_report.sh
      - name: Stage derived coverage files for upload
        if: always()
        run: |
          cov=build/Coverage
          mkdir -p "$cov/coverage_data"
          for f in base.libmerc.info cur.libmerc.info patch.diff cov-tla.json; do
            if [ -f "$cov/$f" ]; then cp "$cov/$f" "$cov/coverage_data/"; fi
          done
      - name: Upload coverage report(s)
        id: upload
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-ubuntu24
          overwrite: true
          if-no-files-found: error
          path: |
            build/Coverage/coverage_report/
            build/Coverage/coverage_report_diff/
            build/Coverage/coverage_data/

  # ========== Coverage Gate (the policy advisory) ==========

  coverage-gate:
    name: Coverage Advisory
    needs: linux-coverage
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate on libmerc patch coverage
        env:
          RESULT:   ${{ needs.linux-coverage.result }}
          CUR_PCT:  ${{ needs.linux-coverage.outputs.cur_pct }}
          BASE_PCT: ${{ needs.linux-coverage.outputs.base_pct }}
          CUR_UNCOV:  ${{ needs.linux-coverage.outputs.cur_uncov }}
          BASE_UNCOV: ${{ needs.linux-coverage.outputs.base_uncov }}
          BASE_SHA: ${{ needs.linux-coverage.outputs.base_sha }}
          BASE_REF: ${{ needs.linux-coverage.outputs.base_ref }}
          GNC:      ${{ needs.linux-coverage.outputs.gnc }}
          UNC:      ${{ needs.linux-coverage.outputs.unc }}
          LBC:      ${{ needs.linux-coverage.outputs.lbc }}
          REPORT_URL: ${{ needs.linux-coverage.outputs.report_url }}
          T: 90   # min % of new/changed libmerc lines that must be covered
          K: 2    # uncovered new lines always forgiven, whatever the percentage
        run: |
          set -o pipefail
          rc=0
          {
            echo "ℹ️ Advisory only — not a required check. Coverage regressions are reported, not enforced."
            echo
            if [ "$RESULT" != success ] && [ "$RESULT" != skipped ]; then
              echo "🔴 **ERROR**: coverage unverified — linux-coverage $RESULT"
              rc=1    # producer broken
            elif [ "$RESULT" = skipped ]; then
              echo "ℹ️ **SKIPPED**: linux-coverage did not run"
            elif [ -z "$BASE_PCT" ]; then
              echo "ℹ️ **SKIPPED**: baseline is HEAD or no baseline to compare"
            else
              new=$((GNC + UNC))
              debt=$((CUR_UNCOV - BASE_UNCOV))
              echo "libmerc line coverage ${BASE_PCT}% → ${CUR_PCT}% (uncovered lines ${BASE_UNCOV} → ${CUR_UNCOV}) vs ${BASE_REF} @ ${BASE_SHA}"
              if [ "$LBC" -gt 0 ]; then
                echo
                echo "⚠️ ${LBC} previously covered libmerc line(s) lost coverage"
              fi
              echo
              if [ "$new" -eq 0 ]; then
                echo "🟢 **PASS**: no new or changed coverable libmerc lines"
              elif [ "$UNC" -le "$K" ] || [ $((100 * GNC)) -ge $((T * new)) ]; then
                echo "🟢 **PASS**: patch coverage ${GNC}/${new} new libmerc lines covered"
              elif [ "$debt" -le 0 ]; then
                echo "🟢 **PASS**: patch coverage ${GNC}/${new}, but the uncovered libmerc total did not rise"
              else
                echo "🔴 **FAIL**: patch coverage ${GNC}/${new} new libmerc lines covered — needs ≥ ${T}%, or ≤ ${K} uncovered, or no rise in the uncovered total (+${debt})"
                rc=1
              fi
            fi
            if [ -n "$REPORT_URL" ]; then
              echo
              echo "📊 [Coverage report artifact]($REPORT_URL) — unzip, then open \`coverage_report_diff/index.html\`"
            fi
            exit $rc
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # ========== macOS Build and Test ==========

  macos-ci:
    if: github.event_name != 'workflow_dispatch' || inputs.run_macos
    runs-on: macos-latest
    steps:
      - name: Get system hardware information
        run: system_profiler SPHardwareDataType
      - name: Get system software information
        run: system_profiler SPSoftwareDataType
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install Homebrew dependencies
        run: |
          brew install zlib gmp  # already installed: python, openssl, cmake
      - name: Install pip packages
        run: |
          mkdir -p ~/.envs
          python3 -m venv ~/.envs/merc
          source ~/.envs/merc/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade jsonschema cryptography Cython wheel setuptools
          echo "$HOME/.envs/merc/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$HOME/.envs/merc" >> "$GITHUB_ENV"
      - name: Build libmerc via CMake
        working-directory: src/libmerc
        run: |
          cmake -DCMAKE_BUILD_TYPE=Debug -DLIBMERC_ONLY=TRUE -B build-debug
          cmake --build build-debug --parallel 1
          cmake -DCMAKE_BUILD_TYPE=Release -DLIBMERC_ONLY=TRUE -B build-release
          cmake --build build-release --parallel 1
      - name: Clean up CMake build directories
        working-directory: src/libmerc
        run: rm -rf build-debug build-release
      - name: configure
        run: |
          touch configure  # update mtime to avoid automatic regen
          ./configure
      - name: Build Mercury RelWithDebInfo
        run: make -j$(sysctl -n hw.ncpu) V=1
      - name: Build Mercury Debug+ASan
        run: make -j$(sysctl -n hw.ncpu) V=1 BUILD_TYPE=Debug SANITIZE=address
      - name: Build Mercury Debug+ASan+visdefault (multiprotocol)
        run: make -j$(sysctl -n hw.ncpu) V=1 BUILD_TYPE=Debug SANITIZE=address VISIBILITY=default
      - name: Build Mercury Debug+ASan+visdefault+staticcfgtls (tls-only)
        run: make -j$(sysctl -n hw.ncpu) V=1 BUILD_TYPE=Debug SANITIZE=address VISIBILITY=default STATIC_CFG=tls
      - name: Build libmerc.so test drivers
        run: make -j$(sysctl -n hw.ncpu) V=1 BUILD_TYPE=Debug SANITIZE=address libmerc-test-drivers
      - name: Generate token for cross-repo access
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REPO_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_READER_PRIVATE_KEY }}
          owner: cisco-netintel
      - name: Checkout mercury-resources
        uses: actions/checkout@v6
        with:
          repository: cisco-netintel/mercury-resources
          ref: verified
          path: unit_tests/xtra/resources
          token: ${{ steps.app-token.outputs.token }}
      - name: Run test-cython (RelWithDebInfo)
        run: make V=1 test-cython
      - name: Run tests (Debug+ASan)
        run: make V=1 BUILD_TYPE=Debug SANITIZE=address test
      - name: Run batch_gcd tests (Debug+ASan)
        run: make V=1 BUILD_TYPE=Debug SANITIZE=address test-batch-gcd

  # ========== Windows Build ==========

  windows-build:
    if: github.event_name != 'workflow_dispatch' || inputs.run_windows
    runs-on: windows-2022
    env:
      CMAKE_TOOLCHAIN_FILE: C:/vcpkg/scripts/buildsystems/vcpkg.cmake
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Get system information
        run: systeminfo
      - name: Get vcpkg location
        run: where.exe vcpkg
      - name: Install dependencies via vcpkg
        run: vcpkg install openssl zlib xsimd
      - name: List vcpkg installed packages
        run: vcpkg list
      - name: Build libmerc via CMake
        working-directory: src/libmerc
        run: |
          cmake -DCMAKE_BUILD_TYPE=Debug -B build-debug
          cmake --build build-debug --parallel 1
          cmake -DCMAKE_BUILD_TYPE=Release -B build-release
          cmake --build build-release --parallel 1

  # ========== Linux Distro (.deb) and Python Packages (.so) ==========

  packages:
    if: github.event_name != 'workflow_dispatch' || inputs.build_packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        testplatform: ["ubuntu22", "ubuntu24", "ubuntu26"]
    container:
      image: ghcr.io/cisco-netintel/${{ matrix.testplatform }}:buildenv
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Echo OS version
        run: cat /etc/os-release
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: configure
        run: |
          touch configure  # update mtime to avoid automatic regen
          ./configure
      - name: make
        run: make -j$(nproc) V=1
      - name: Build Mercury Cython
        run: make -j$(nproc) V=1 cython test-cython
      - name: Build distro package
        run: |
          export SHORT_HASH=$(echo ${{ github.sha }} | cut -c1-8)
          MERCURY_BIN=build/RelWithDebInfo/bin/mercury ./build_pkg.sh -t deb -o build/RelWithDebInfo/pkg -i ${{ github.run_number }}-$SHORT_HASH
      - name: Verify build artifacts exist
        run: |
          echo "=== Checking distro package ==="
          ls -la build/RelWithDebInfo/pkg/mercury*.deb
          echo "=== Checking Cython shared object ==="
          ls -la build/RelWithDebInfo/cython/lib/*.so
          echo "=== Checking wheel ==="
          ls -la build/RelWithDebInfo/cython/dist/*.whl
      - name: Upload distro package as artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.testplatform }}
          overwrite: true
          if-no-files-found: error
          path: |
            build/RelWithDebInfo/pkg/mercury*.deb
            build/RelWithDebInfo/cython/lib/*.so
            build/RelWithDebInfo/cython/dist/*.whl

  # ========== Status Check Summary (Single Required Check) ==========

  # This sentinel job provides a single status that can be used for branch
  # protection ("Require status checks to pass before merging").
  #
  # It succeeds only if all platform-specific jobs that ran have succeeded. Jobs
  # skipped via workflow_dispatch inputs are treated as successful, which is
  # useful for testing specific platforms (e.g., running macOS builds only).
  #
  # Note: workflow_dispatch (manual trigger) never serves as a status check for
  # a push or PR.  Pull requests require the automatic PR-triggered run to pass.

  ci-success:
    name: Mercury CI Checks
    if: ${{ always() && !cancelled() }}
    needs: [linux-ci, linux-fuzz, linux-coverage, macos-ci, windows-build, packages]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo "linux-ci: ${{ needs.linux-ci.result }}"
          echo "linux-fuzz: ${{ needs.linux-fuzz.result }}"
          echo "linux-coverage: ${{ needs.linux-coverage.result }}"
          echo "macos-ci: ${{ needs.macos-ci.result }}"
          echo "windows-build: ${{ needs.windows-build.result }}"
          echo "packages: ${{ needs.packages.result }}"

          # Treat skipped jobs as success (allows workflow_dispatch with subset)
          # Fail if any job failed or was cancelled
          if [[ "${{ needs.linux-ci.result }}" == "failure" ]] || \
             [[ "${{ needs.linux-ci.result }}" == "cancelled" ]] || \
             [[ "${{ needs.linux-fuzz.result }}" == "failure" ]] || \
             [[ "${{ needs.linux-fuzz.result }}" == "cancelled" ]] || \
             [[ "${{ needs.linux-coverage.result }}" == "failure" ]] || \
             [[ "${{ needs.linux-coverage.result }}" == "cancelled" ]] || \
             [[ "${{ needs.macos-ci.result }}" == "failure" ]] || \
             [[ "${{ needs.macos-ci.result }}" == "cancelled" ]] || \
             [[ "${{ needs.windows-build.result }}" == "failure" ]] || \
             [[ "${{ needs.windows-build.result }}" == "cancelled" ]] || \
             [[ "${{ needs.packages.result }}" == "failure" ]] || \
             [[ "${{ needs.packages.result }}" == "cancelled" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi

          echo "All checks passed or were skipped"
